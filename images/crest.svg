<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 122" role="img" aria-label="Stylised blaugrana supporters' crest">
  <defs>
    <clipPath id="crest-shield">
      <path d="M6 6 H94 V60 C94 90 72 108 50 118 C28 108 6 90 6 60 Z"/>
    </clipPath>
  </defs>
  <!-- gold shield border -->
  <path d="M2 2 H98 V60 C98 93 74 113 50 122 C26 113 2 93 2 60 Z" fill="#EDBB00"/>
  <g clip-path="url(#crest-shield)">
    <rect x="0" y="0" width="100" height="122" fill="#004D98"/>
    <!-- upper garnet/blue vertical stripes (the jersey) -->
    <rect x="6" y="6" width="22" height="46" fill="#A50044"/>
    <rect x="28" y="6" width="22" height="46" fill="#004D98"/>
    <rect x="50" y="6" width="22" height="46" fill="#A50044"/>
    <rect x="72" y="6" width="22" height="46" fill="#004D98"/>
    <!-- gold mid band -->
    <rect x="0" y="52" width="100" height="11" fill="#EDBB00"/>
    <!-- lower garnet field -->
    <rect x="0" y="63" width="100" height="59" fill="#A50044"/>
    <!-- football -->
    <circle cx="50" cy="86" r="13" fill="#FFFFFF"/>
    <circle cx="50" cy="86" r="13" fill="none" stroke="#14152A" stroke-width="1.6"/>
    <polygon points="50,79.5 55.5,83.5 53.4,90 46.6,90 44.5,83.5" fill="#14152A"/>
  </g>
</svg>
